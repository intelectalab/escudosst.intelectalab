# Sitio de EscudoSST en el nginx DEL SERVIDOR (no el del contenedor).
# Va en /etc/nginx/sites-available/escudosst.intelectalab.com y se enlaza en sites-enabled.
# Primero se publica solo el bloque :80; certbot (--nginx) agrega el bloque 443 con el certificado.

server {
    listen 80;
    listen [::]:80;
    server_name escudosst.intelectalab.com;

    client_max_body_size 64M;
    add_header Strict-Transport-Security "max-age=31536000" always;   # solo este subdominio

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
    }
}

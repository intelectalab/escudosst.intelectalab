; Procesos de PHP-FPM para la API (VPS de 4 CPU y 8 GB compartido con otros sistemas).
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
; Los avisos de PHP van al registro del contenedor.
catch_workers_output = yes
clear_env = no

; PHP de desarrollo. Docker en Windows lee lento los archivos de la carpeta compartida,
; así que OPcache guarda el código compilado y revisa cambios cada 2 segundos.
; vendor/ vive en un volumen de Docker (rápido); tu código sí se lee de la carpeta.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.memory_consumption=256
opcache.max_accelerated_files=30000
realpath_cache_size=4096K
realpath_cache_ttl=600
memory_limit=512M
date.timezone=America/Lima

; PHP en producción: sin mostrar errores al visitante, opcache activo y la zona horaria del negocio.
date.timezone = America/Lima
display_errors = Off
log_errors = On
expose_php = Off
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El código no cambia dentro del contenedor: se reconstruye la imagen en cada versión.
opcache.validate_timestamps = 0

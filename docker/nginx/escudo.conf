# nginx interno de EscudoSST (docs/15 §2.2). El HTTPS lo pone el nginx del servidor (certbot) y reenvía aquí.
#   /api/...  → Laravel (php-fpm, contenedor «api»)
#   todo lo demás → sitio y paneles (Next.js, contenedor «web»)

# Docker cambia la IP de un contenedor cuando se reinicia: se vuelve a resolver el nombre cada 10 s
# (con «upstream» fijo, nginx seguiría apuntando a la IP vieja y respondería 502).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    set $api_backend api:9000;
    set $web_backend http://web:3000;

    client_max_body_size 64M;

    # Respuestas comprimidas: los listados y tableros (JSON) y el sitio pesan varias veces menos al viajar.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/problem+json application/javascript text/css text/plain image/svg+xml application/manifest+json;

    # Cabeceras de seguridad (el HSTS lo agrega el nginx del servidor, que es quien tiene el certificado).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API Laravel: todo pasa por public/index.php (no se sirven archivos de la carpeta del backend).
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param HTTPS $fwd_https;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_pass $api_backend;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass $api_backend;
    }

    # Archivos estáticos de Next con caché larga (llevan huella en el nombre).
    location ^~ /_next/static/ {
        proxy_pass $web_backend;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass $web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}

# El nginx del servidor manda X-Forwarded-Proto: https. Si no viene (llamada interna), se asume http.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $fwd_proto $fwd_https {
    https   on;
    default "";
}
